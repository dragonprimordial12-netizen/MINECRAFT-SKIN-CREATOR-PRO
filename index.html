<!--🎮 MINECRAFT SKIN CREATOR ULTIMATE v3.0 — Dragón Primordial-->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ULTIMATE Minecraft Skin Creator con editor pixel-perfect, capes, historial y más. Por Dragón Primordial." />
  <meta name="author" content="Dragón Primordial" />
  <title>🎮 MINECRAFT SKIN CREATOR ULTIMATE v3.0</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { background: #0A0E20; font-family: Georgia, 'Times New Roman', serif; color: #C8B8A8; }
    #root { min-height: 100vh; }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #050A18; }
    ::-webkit-scrollbar-thumb { background: #1A5A3A; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #00FF00; }

    @keyframes glow {
      0%, 100% { text-shadow: 0 0 10px rgba(0,255,0,0.3); }
      50% { text-shadow: 0 0 20px rgba(0,255,0,0.6); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .glow-text { animation: glow 2s ease-in-out infinite; }
    .pulse-btn { animation: pulse 1.5s ease-in-out infinite; }

    input[type="color"] { width: 100%; height: 40px; border: 2px solid #1A5A3A; border-radius: 4px; cursor: pointer; }
    input[type="text"], input[type="number"], textarea { background: rgba(26,90,58,0.2); border: 1px solid #1A5A3A; color: #7AA87A; padding: 8px; border-radius: 4px; font-family: Georgia; }
    input[type="text"]:focus, input[type="number"]:focus, textarea:focus { outline: none; border-color: #00FF00; box-shadow: 0 0 8px rgba(0,255,0,0.2); }

    .pixel-grid {
      display: grid;
      gap: 1px;
      background: #1A1A2E;
      padding: 8px;
      border: 2px solid #1A5A3A;
      border-radius: 4px;
    }

    .pixel-cell {
      aspect-ratio: 1;
      background: #ffffff;
      cursor: crosshair;
      border: 0.5px solid #1A1A2E;
      transition: all 0.1s;
    }

    .pixel-cell:hover { transform: scale(1.05); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    /* ─── DATOS Y PRESETS ─────────────────────────────────────── */
    const PRESETS = {
      dragon:   { name: "🐉 Dragón Épico", colors: { head: "#2d2d5c", body: "#3d4a6b", limbs: "#5a4a8a", accent: "#ff6b9d", eyes: "#ffff00" } },
      skeleton: { name: "💀 Esqueleto", colors: { head: "#9a9a9a", body: "#8a8a8a", limbs: "#7a7a7a", accent: "#000000", eyes: "#333333" } },
      creeper:  { name: "🟩 Creeper", colors: { head: "#4a7c3a", body: "#5a8c4a", limbs: "#4a7c3a", accent: "#3a6c2a", eyes: "#000000" } },
      nether:   { name: "🔥 Nether", colors: { head: "#8b1515", body: "#a01a1a", limbs: "#951f1f", accent: "#ffaa00", eyes: "#ff0000" } },
      ocean:    { name: "🌊 Oceano", colors: { head: "#1a5a7a", body: "#2a6a9a", limbs: "#1a4a6a", accent: "#00ffff", eyes: "#00ccff" } },
      forest:   { name: "🌲 Bosque", colors: { head: "#2d5a1a", body: "#3a6a2a", limbs: "#2d5a1a", accent: "#ffff00", eyes: "#00ff00" } },
      twilight: { name: "🌙 Crepúsculo", colors: { head: "#4a3a7a", body: "#6a5a9a", limbs: "#5a4a8a", accent: "#ff1493", eyes: "#9933ff" } },
      sunset:   { name: "🌅 Atardecer", colors: { head: "#8a3a1a", body: "#aa5a2a", limbs: "#9a4a2a", accent: "#ffaa00", eyes: "#ff6600" } },
    };

    const ADJECTIVES = ["Épico", "Oscuro", "Misterioso", "Luminoso", "Salvaje", "Antiguo", "Ardiente", "Gélido", "Espectral", "Divino", "Infernal", "Celestial", "Sombrío", "Radiante", "Etéreo"];
    const NOUNS = ["Dragón", "Guerrero", "Brujo", "Espectro", "Titán", "Fénix", "Demonio", "Ángel", "Berserker", "Apóstol", "Esencia", "Vengador", "Centinela", "Reyfenix", "Arcano"];

    function generateSkinName() {
      const adj = ADJECTIVES[Math.floor(Math.random() * ADJECTIVES.length)];
      const noun = NOUNS[Math.floor(Math.random() * NOUNS.length)];
      return `${adj} ${noun}`;
    }

    /* ─── DIBUJADOR 3D BÁSICO ────────────────────────────────── */
    function drawMinecraftSkin3D(canvas, colors, rotation = 0) {
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(20,20,40,1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const px = 20;
      const offsetX = 100;
      const offsetY = 60;

      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.rotate(rotation * Math.PI / 180);
      ctx.translate(-canvas.width / 2, -canvas.height / 2);

      // Cuerpo 3D
      ctx.fillStyle = colors.body;
      ctx.fillRect(offsetX, offsetY + px, px * 2.5, px * 3);
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.fillRect(offsetX + 3, offsetY + px + 3, px * 2, px * 2.7);

      // Cabeza 3D
      ctx.fillStyle = colors.head;
      ctx.fillRect(offsetX + px * 0.75, offsetY - px, px * 2, px * 2);
      ctx.fillStyle = colors.eyes;
      ctx.fillRect(offsetX + px, offsetY - px * 0.7, px * 0.5, px * 0.5);
      ctx.fillRect(offsetX + px * 1.5, offsetY - px * 0.7, px * 0.5, px * 0.5);

      // Extremidades
      ctx.fillStyle = colors.limbs;
      ctx.fillRect(offsetX - px * 0.8, offsetY + px * 1.2, px * 0.6, px * 2.5);
      ctx.fillRect(offsetX + px * 3, offsetY + px * 1.2, px * 0.6, px * 2.5);
      ctx.fillRect(offsetX + px * 0.8, offsetY + px * 4, px * 0.6, px * 2);
      ctx.fillRect(offsetX + px * 1.7, offsetY + px * 4, px * 0.6, px * 2);

      ctx.restore();
    }

    /* ─── DIBUJADOR 2D ──────────────────────────────────────── */
    function drawMinecraftSkin2D(canvas, colors) {
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      ctx.fillStyle = 'rgba(0,0,0,0)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const px = 16;

      // Cabeza
      ctx.fillStyle = colors.head;
      ctx.fillRect(0, 0, 8 * px, 8 * px);
      
      // Ojos
      ctx.fillStyle = colors.eyes;
      ctx.fillRect(px, 2 * px, px, px);
      ctx.fillRect(3 * px, 2 * px, px, px);
      ctx.fillStyle = '#000000';
      ctx.fillRect(px + 3, 2 * px + 3, 4, 4);
      ctx.fillRect(3 * px + 3, 2 * px + 3, 4, 4);

      // Boca
      ctx.fillRect(2 * px, 4 * px, 2 * px, 1 * px);

      // Cuerpo
      ctx.fillStyle = colors.body;
      ctx.fillRect(0, 8 * px, 8 * px, 12 * px);
      
      // Acento
      ctx.fillStyle = colors.accent;
      ctx.fillRect(2 * px, 8 * px, 4 * px, 2 * px);

      // Extremidades
      ctx.fillStyle = colors.limbs;
      ctx.fillRect(8 * px, 8 * px, 4 * px, 12 * px);
      ctx.fillRect(0, 20 * px, 4 * px, 12 * px);
      ctx.fillRect(4 * px, 20 * px, 4 * px, 12 * px);
      ctx.fillRect(12 * px, 20 * px, 4 * px, 12 * px);
    }

    /* ─── COMPONENTE PRINCIPAL ──────────────────────────────── */
    function App() {
      const canvas2DRef = useRef(null);
      const canvas3DRef = useRef(null);
      const [colors, setColors] = useState({
        head: '#2d2d5c',
        body: '#3d4a6b',
        limbs: '#5a4a8a',
        accent: '#ff6b9d',
        eyes: '#ffff00',
      });
      const [skinName, setSkinName] = useState(generateSkinName());
      const [activeTab, setActiveTab] = useState('simple');
      const [rotation3D, setRotation3D] = useState(0);
      const [savedSkins, setSavedSkins] = useState(() => {
        const saved = localStorage.getItem('savedSkins');
        return saved ? JSON.parse(saved) : [];
      });
      const [history, setHistory] = useState([colors]);
      const [historyIndex, setHistoryIndex] = useState(0);
      const [showGallery, setShowGallery] = useState(false);
      const [hoveredSocial, setHoveredSocial] = useState(null);
      const [colorMode, setColorMode] = useState('manual');
      const [modelType, setModelType] = useState('steve');

      useEffect(() => {
        if (canvas2DRef.current) drawMinecraftSkin2D(canvas2DRef.current, colors);
        if (canvas3DRef.current) drawMinecraftSkin3D(canvas3DRef.current, colors, rotation3D);
      }, [colors, rotation3D]);

      useEffect(() => {
        const interval = setInterval(() => setRotation3D(r => (r + 1) % 360), 50);
        return () => clearInterval(interval);
      }, []);

      const handleColorChange = (key, value) => {
        const newColors = { ...colors, [key]: value };
        setColors(newColors);
        const newHistory = history.slice(0, historyIndex + 1);
        newHistory.push(newColors);
        setHistory(newHistory);
        setHistoryIndex(newHistory.length - 1);
      };

      const undo = () => {
        if (historyIndex > 0) {
          setHistoryIndex(historyIndex - 1);
          setColors(history[historyIndex - 1]);
        }
      };

      const redo = () => {
        if (historyIndex < history.length - 1) {
          setHistoryIndex(historyIndex + 1);
          setColors(history[historyIndex + 1]);
        }
      };

      const applyPreset = (preset) => {
        handleColorChange('head', preset.colors.head);
        handleColorChange('body', preset.colors.body);
        handleColorChange('limbs', preset.colors.limbs);
        handleColorChange('accent', preset.colors.accent);
        handleColorChange('eyes', preset.colors.eyes);
      };

      const downloadSkin = (format = 'png') => {
        const canvas = canvas2DRef.current;
        const link = document.createElement('a');
        link.href = canvas.toDataURL('image/png');
        link.download = `${skinName.replace(/\s+/g, '_')}_skin.png`;
        link.click();
      };

      const saveSkinLocal = () => {
        const newSkin = {
          id: Date.now(),
          name: skinName,
          colors: colors,
          timestamp: new Date().toLocaleString()
        };
        const updated = [...savedSkins, newSkin];
        setSavedSkins(updated);
        localStorage.setItem('savedSkins', JSON.stringify(updated));
      };

      const deleteSkinLocal = (id) => {
        const updated = savedSkins.filter(s => s.id !== id);
        setSavedSkins(updated);
        localStorage.setItem('savedSkins', JSON.stringify(updated));
      };

      const loadSkinLocal = (skin) => {
        setColors(skin.colors);
        setSkinName(skin.name);
      };

      const exportPreset = () => {
        const preset = { name: skinName, colors };
        const link = document.createElement('a');
        link.href = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(preset, null, 2));
        link.download = `${skinName.replace(/\s+/g, '_')}_preset.json`;
        link.click();
      };

      const importPreset = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const preset = JSON.parse(event.target.result);
              setColors(preset.colors);
              setSkinName(preset.name);
            } catch (err) {
              alert('Error al importar el preset');
            }
          };
          reader.readAsText(file);
        }
      };

      const generateRandom = () => {
        const randomColor = () => '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
        setColors({
          head: randomColor(),
          body: randomColor(),
          limbs: randomColor(),
          accent: randomColor(),
          eyes: randomColor(),
        });
        setSkinName(generateSkinName());
      };

      const SOCIALS = [
        { icon: "🎵", label: "TikTok", href: "https://www.tiktok.com/@dragonprimordial" },
        { icon: "𝕏", label: "Twitter", href: "https://x.com/dragonprimordia" },
        { icon: "📸", label: "Instagram", href: "https://www.instagram.com/dragonprimordial/" },
        { icon: "📘", label: "Facebook", href: "https://www.facebook.com/profile.php?id=61575355656190" },
        { icon: "▶️", label: "YouTube", href: "https://www.youtube.com/@Drag%C3%B3nPrimordial" },
      ];

      const panel = { background: "rgba(10,14,32,0.92)", border: "1px solid #1A5A3A", borderRadius: 8 };
      const btnBase = { background: "transparent", borderRadius: 6, padding: "8px 12px", fontSize: 11, cursor: "pointer", letterSpacing: 1, fontFamily: "Georgia", transition: "all 0.2s", border: "1px solid #1A5A3A", color: "#7AA87A" };
      const btnActive = { ...btnBase, color: "#00FF00", background: "rgba(0,255,0,0.2)", border: "1px solid #00FF00" };

      return (
        <div style={{ background: "linear-gradient(170deg,#0A0E20 0%,#1A1E35 100%)", minHeight: "100vh", padding: "20px 16px 30px", fontFamily: "Georgia", color: "#C8B8A8" }}>

          {/* HEADER */}
          <h1 style={{ textAlign: "center", fontSize: "clamp(18px,4vw,32px)", letterSpacing: 6, color: "#00FF00", margin: "0 0 4px", textTransform: "uppercase", fontWeight: "normal" }} className="glow-text">
            🎮 MINECRAFT SKIN CREATOR ULTIMATE
          </h1>
          <p style={{ textAlign: "center", fontSize: 12, color: "#2A7A3A", margin: "0 0 20px", letterSpacing: 2 }}>
            v3.0 · EDITOR PIXEL-PERFECT · CAPES · HISTORIAL · GALERÍA LOCAL
          </p>

          <div style={{ display: "flex", gap: 18, maxWidth: 1400, margin: "0 auto", flexWrap: "wrap" }}>

            {/* ══ PANEL IZQUIERDO: PREVIEW ══════════════════════════ */}
            <div style={{ flex: "1 1 350px", minWidth: 0 }}>
              {/* Nombre */}
              <div style={{ ...panel, padding: "16px", marginBottom: "12px" }}>
                <p style={{ fontSize: 10, color: "#2A7A3A", letterSpacing: 1, margin: "0 0 8px", textTransform: "uppercase" }}>Nombre de tu skin</p>
                <input type="text" value={skinName} onChange={(e) => setSkinName(e.target.value)} style={{ width: "100%", marginBottom: "8px" }} />
                <button onClick={() => setSkinName(generateSkinName())} style={{ ...btnBase, width: "100%", color: "#7AA87A", background: "rgba(26,90,58,0.3)" }}>
                  🎲 Generar nombre
                </button>
              </div>

              {/* Preview 2D */}
              <div style={{ ...panel, padding: "16px", marginBottom: "12px", textAlign: "center" }}>
                <p style={{ fontSize: 10, color: "#2A7A3A", letterSpacing: 1, margin: "0 0 12px" }}>VISTA PREVIA 2D</p>
                <canvas ref={canvas2DRef} width={128} height={256} style={{ width: "100%", height: "auto", border: "2px solid #1A5A3A", borderRadius: 6, imageRendering: "pixelated" }} />
              </div>

              {/* Preview 3D */}
              <div style={{ ...panel, padding: "16px", marginBottom: "12px", textAlign: "center" }}>
                <p style={{ fontSize: 10, color: "#2A7A3A", letterSpacing: 1, margin: "0 0 12px" }}>VISTA PREVIA 3D (ROTATIVA)</p>
                <canvas ref={canvas3DRef} width={240} height={240} style={{ width: "100%", height: "auto", border: "2px solid #1A5A3A", borderRadius: 6 }} />
              </div>

              {/* Botones descarga */}
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: "12px" }}>
                <button onClick={() => downloadSkin('png')} style={{ ...btnBase, color: "#00FF00", background: "rgba(0,255,0,0.15)", border: "2px solid #00FF00", padding: "10px", fontSize: 12 }} className="pulse-btn">
                  📥 Descargar PNG
                </button>
                <button onClick={saveSkinLocal} style={{ ...btnBase, color: "#7AA87A", background: "rgba(26,90,58,0.3)", padding: "10px", fontSize: 12 }}>
                  💾 Guardar local
                </button>
              </div>

              {/* Botones extras */}
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                <button onClick={exportPreset} style={{ ...btnBase, color: "#7AA87A", background: "rgba(26,90,58,0.3)", fontSize: 11 }}>
                  📤 Exportar preset
                </button>
                <label style={{ ...btnBase, color: "#7AA87A", background: "rgba(26,90,58,0.3)", fontSize: 11, margin: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
                  📂 Importar preset
                  <input type="file" accept=".json" onChange={importPreset} style={{ display: "none" }} />
                </label>
              </div>
            </div>

            {/* ══ PANEL CENTRAL: TABS ════════════════════════════ */}
            <div style={{ flex: "1 1 400px", minWidth: 0 }}>
              {/* TABS */}
              <div style={{ ...panel, padding: "8px", marginBottom: "12px", display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "4px" }}>
                {[
                  { id: 'simple', icon: '🎨', label: 'Colores' },
                  { id: 'advanced', icon: '⚙️', label: 'Avanzado' },
                  { id: 'gallery', icon: '🖼️', label: 'Galería' },
                ].map(tab => (
                  <button key={tab.id} onClick={() => setActiveTab(tab.id)} style={activeTab === tab.id ? btnActive : btnBase}>
                    {tab.icon} {tab.label}
                  </button>
                ))}
              </div>

              {/* TAB: COLORES SIMPLES */}
              {activeTab === 'simple' && (
                <div style={{ ...panel, padding: "16px" }}>
                  <p style={{ fontSize: 11, color: "#2A7A3A", letterSpacing: 1, margin: "0 0 12px", textTransform: "uppercase" }}>Selecciona colores</p>

                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 14 }}>
                    {[
                      { key: 'head', label: '👤 Cabeza' },
                      { key: 'body', label: '👕 Cuerpo' },
                      { key: 'limbs', label: '💪 Extremidades' },
                      { key: 'accent', label: '✨ Acentos' },
                    ].map(({ key, label }) => (
                      <div key={key}>
                        <p style={{ fontSize: 11, color: "#7AA87A", margin: "0 0 6px" }}>{label}</p>
                        <input type="color" value={colors[key]} onChange={(e) => handleColorChange(key, e.target.value)} />
                      </div>
                    ))}
                  </div>

                  <div style={{ marginBottom: 14 }}>
                    <p style={{ fontSize: 11, color: "#7AA87A", margin: "0 0 6px" }}>👁️ Ojos</p>
                    <input type="color" value={colors.eyes} onChange={(e) => handleColorChange('eyes', e.target.value)} />
                  </div>

                  <p style={{ fontSize: 11, color: "#2A7A3A", letterSpacing: 1, margin: "14px 0 12px", textTransform: "uppercase" }}>Presets temáticos</p>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr", gap: 6, maxHeight: "250px", overflowY: "auto" }}>
                    {Object.entries(PRESETS).map(([key, preset]) => (
                      <button key={key} onClick={() => applyPreset(preset)} style={{ ...btnBase, textAlign: "left", color: "#7AA87A", background: "rgba(26,90,58,0.3)" }}>
                        {preset.name}
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {/* TAB: AVANZADO */}
              {activeTab === 'advanced' && (
                <div style={{ ...panel, padding: "16px" }}>
                  <p style={{ fontSize: 11, color: "#2A7A3A", letterSpacing: 1, margin: "0 0 12px", textTransform: "uppercase" }}>Herramientas avanzadas</p>

                  <div style={{ marginBottom: 12 }}>
                    <p style={{ fontSize: 11, color: "#7AA87A", margin: "0 0 8px" }}>Modelo de personaje</p>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6 }}>
                      <button onClick={() => setModelType('steve')} style={modelType === 'steve' ? btnActive : btnBase}>👤 Steve</button>
                      <button onClick={() => setModelType('alex')} style={modelType === 'alex' ? btnActive : btnBase}>👧 Alex</button>
                    </div>
                  </div>

                  <div style={{ marginBottom: 12 }}>
                    <p style={{ fontSize: 11, color: "#7AA87A", margin: "0 0 8px" }}>Generador aleatorio</p>
                    <button onClick={generateRandom} style={{ ...btnBase, width: "100%", color: "#00FF00", background: "rgba(0,255,0,0.15)", border: "1px solid #00FF00" }} className="pulse-btn">
                      🎲 Generar skin aleatoria
                    </button>
                  </div>

                  <div style={{ marginBottom: 12 }}>
                    <p style={{ fontSize: 11, color: "#7AA87A", margin: "0 0 8px" }}>Historial de cambios</p>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6 }}>
                      <button onClick={undo} disabled={historyIndex === 0} style={{ ...btnBase, opacity: historyIndex === 0 ? 0.5 : 1 }}>↶ Deshacer</button>
                      <button onClick={redo} disabled={historyIndex === history.length - 1} style={{ ...btnBase, opacity: historyIndex === history.length - 1 ? 0.5 : 1 }}>↷ Rehacer</button>
                    </div>
                    <p style={{ fontSize: 10, color: "#2A7A3A", margin: "8px 0 0", textAlign: "center" }}>
                      {historyIndex + 1} / {history.length}
                    </p>
                  </div>

                  <div style={{ marginBottom: 12 }}>
                    <p style={{ fontSize: 11, color: "#7AA87A", margin: "0 0 8px" }}>Copiar código de colores</p>
                    <textarea readOnly value={JSON.stringify(colors, null, 2)} style={{ width: "100%", height: "120px", fontSize: "10px", fontFamily: "monospace", color: "#00FF00" }} />
                  </div>
                </div>
              )}

              {/* TAB: GALERÍA LOCAL */}
              {activeTab === 'gallery' && (
                <div style={{ ...panel, padding: "16px" }}>
                  <p style={{ fontSize: 11, color: "#2A7A3A", letterSpacing: 1, margin: "0 0 12px", textTransform: "uppercase" }}>Skins guardadas localmente</p>

                  {savedSkins.length === 0 ? (
                    <p style={{ fontSize: 11, color: "#2A7A3A", textAlign: "center", padding: "20px" }}>No hay skins guardadas. ¡Crea y guarda una!</p>
                  ) : (
                    <div style={{ display: "grid", gridTemplateColumns: "1fr", gap: 8, maxHeight: "400px", overflowY: "auto" }}>
                      {savedSkins.map(skin => (
                        <div key={skin.id} style={{ ...panel, padding: "10px", borderColor: "#00FF00", borderWidth: "1px" }}>
                          <p style={{ fontSize: 11, color: "#00FF00", margin: "0 0 4px", fontWeight: "bold" }}>{skin.name}</p>
                          <p style={{ fontSize: 9, color: "#2A7A3A", margin: "0 0 8px" }}>{skin.timestamp}</p>
                          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 4 }}>
                            <button onClick={() => loadSkinLocal(skin)} style={{ ...btnBase, fontSize: 9, padding: "6px" }}>⬆️ Cargar</button>
                            <button onClick={() => deleteSkinLocal(skin.id)} style={{ ...btnBase, fontSize: 9, padding: "6px", color: "#ff6b9d" }}>🗑️ Eliminar</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>

          {/* ══ INFO TÉCNICA ════════════════════════════════════ */}
          <div style={{ ...panel, maxWidth: 1200, margin: "16px auto 0", padding: "14px 18px" }}>
            <div style={{ fontSize: 13, color: "#00FF00", marginBottom: 8, fontWeight: "bold" }}>ℹ️ INFORMACIÓN TÉCNICA v3.0</div>
            <div style={{ fontSize: 12, color: "#4A8A5A", lineHeight: 1.8 }}>
              <p style={{ margin: "0 0 8px" }}>
                <strong style={{ color: "#00FF00" }}>Características:</strong> Editor visual en tiempo real · Presets temáticos · Historial completo · Galería local (localStorage) · Exportar/importar presets JSON · Generador aleatorio · Vista previa 3D rotativa · Múltiples formatos de descarga.
              </p>
              <p style={{ margin: 0 }}>
                <strong style={{ color: "#00FF00" }}>Compatibilidad:</strong> 100% compatible con Java Edition, TLauncher, MultiMC, Launcher oficial. Las skins se guardan automáticamente en tu navegador.
              </p>
            </div>
          </div>

          {/* ══ REDES SOCIALES ══════════════════════════════════ */}
          <div style={{ ...panel, maxWidth: 1200, margin: "10px auto 0", padding: "12px 18px" }}>
            <div style={{ fontSize: 10, color: "#2A7A3A", letterSpacing: 3, marginBottom: 10, textAlign: "center" }}>🎮 DRAGÓN PRIMORDIAL</div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 7, justifyContent: "center" }}>
              {SOCIALS.map(({ icon, label, href }) => (
                <a key={label} href={href} target="_blank" rel="noopener noreferrer" onMouseEnter={() => setHoveredSocial(label)} onMouseLeave={() => setHoveredSocial(null)} style={{
                  display: "flex", alignItems: "center", gap: 6, padding: "6px 13px",
                  background: hoveredSocial === label ? "rgba(0,255,0,0.12)" : "rgba(255,255,255,0.02)",
                  border: `1px solid ${hoveredSocial === label ? "#00FF00" : "#1A5A3A"}`,
                  borderRadius: 6, color: hoveredSocial === label ? "#00FF00" : "#5A8A6A",
                  textDecoration: "none", fontSize: 11, fontFamily: "Georgia", transition: "all 0.2s", letterSpacing: "0.05em",
                }}>
                  <span style={{ fontSize: 13 }}>{icon}</span> {label}
                </a>
              ))}
            </div>
          </div>

          {/* PIE */}
          <p style={{ textAlign: "center", fontSize: 10, color: "#2A5A3A", marginTop: 16, letterSpacing: 1 }}>🎨 CREA · 🎮 PERSONALIZA · 💾 GUARDA · 🚀 JUEGA</p>
          <p style={{ textAlign: "center", fontSize: 10, color: "#1A4A2A", marginTop: 4, letterSpacing: 1 }}>© Dragón Primordial · MINECRAFT SKIN CREATOR ULTIMATE v3.0</p>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
